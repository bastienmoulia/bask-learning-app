<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <span class="brand__badge" aria-hidden="true">🟢</span>
      <span>
        <strong>Bask</strong>
        <span class="brand__tag">Basque from zero, one win at a time</span>
      </span>
    </a>

    <nav aria-label="Primary">
      @if (isSignedIn()) {
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
          Dashboard
        </a>
        <a [routerLink]="['/lesson', 'starter-basque-greetings']" routerLinkActive="is-active">
          First lesson
        </a>
        @if (isAdmin()) {
          <a routerLink="/admin" routerLinkActive="is-active">Admin</a>
        }
      } @else {
        <a
          routerLink="/sign-in"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Sign in
        </a>
      }
    </nav>

    @if (learner()) {
      <button class="button button--secondary topbar__action" type="button" (click)="signOut()">Sign out</button>
    }
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="footer">
    <p>Bask pairs short lessons, streaks, and Firebase-backed sign-in for returning learners.</p>
  </footer>
</div>
